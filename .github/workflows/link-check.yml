# Weekly link check. Opens or updates one rolling issue; never edits content.
# 403 and 429 are accepted because publisher sites block and rate-limit bots.
name: Link check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept '200..=299,403,429'
            --max-retries 3
            --timeout 30
            readme.md contributing.md
          output: ./link-report.md
          fail: false

      - name: Find the open link-check issue
        if: steps.lychee.outputs.exit_code != 0
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label link-check --state open --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open or update the rolling issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Link check report
          content-filepath: ./link-report.md
          labels: link-check
          issue-number: ${{ steps.find.outputs.number }}
